appId: com.safeguard.parentalcontrol
name: Critical Path - Full User Journey
tags:
  - critical
  - e2e
---
- launchApp
# Step 1: Onboarding - Login
- tapOn:
    text: "Email"
- inputText: "e2e-${OUTPUT.timestamp}@test.com"
- tapOn:
    text: "Password"
- inputText: "Test1234!"
- tapOn: "Sign In"
- waitForAnimationToEnd

# Step 2: PIN Gate (if shown - ParentLockScreen)
- tapOn:
    text: "Parent PIN"
- inputText: "123456"
- tapOn: "Unlock"
- waitForAnimationToEnd

# Step 3: Dashboard tabs
- tapOn: "Apps"
- tapOn: "Screen time"
- tapOn: "Location"
- tapOn: "Contacts"
- tapOn: "Security"

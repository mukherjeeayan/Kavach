version: "3.9"

# Local development stack for Kavach. Brings up the database the
# backend depends on; run backend + frontend with their npm scripts so
# edits hot-reload (ts-node-dev / vite).
#
# Usage: docker compose up -d
# For custom passwords: POSTGRES_PASSWORD=xxx docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: kavach-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local dev}
      POSTGRES_DB: ${DB_NAME:-kavach}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-kavach}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kavach-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
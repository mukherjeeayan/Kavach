# secrets.yml - Kubernetes secrets template
# WARNING: Do not commit this file with actual secrets!
# Use: kubectl create secret generic kavach-secrets --from-file=secrets.yml
#
# Or create secrets directly:
# kubectl create secret generic kavach-secrets \
#   --namespace=kavach \
#   --from-literal=db-user=postgres \
#   --from-literal=db-password=YOUR_DB_PASSWORD \
#   --from-literal=redis-password=YOUR_REDIS_PASSWORD \
#   --from-literal=jwt-secret=YOUR_JWT_SECRET \
#   --from-literal=jwt-refresh-secret=YOUR_JWT_REFRESH_SECRET

apiVersion: v1
kind: Secret
metadata:
  name: kavach-secrets
  namespace: kavach
type: Opaque
stringData:
  db-user: postgres
  db-password: CHANGE_ME
  redis-password: CHANGE_ME
  jwt-secret: CHANGE_ME
  jwt-refresh-secret: CHANGE_ME
---
# TLS secret referenced by ingress.yml (kavach-tls).
# This is normally auto-managed by cert-manager with the letsencrypt-prod
# ClusterIssuer. The template below shows the expected shape if you need
# to bootstrap it manually (e.g. for staging or a private CA).
#
# To create from cert files:
#   kubectl create secret tls kavach-tls \
#     --namespace=kavach \
#     --cert=./fullchain.pem \
#     --key=./privkey.pem
apiVersion: v1
kind: Secret
metadata:
  name: kavach-tls
  namespace: kavach
type: kubernetes.io/tls
stringData:
  tls.crt: CHANGE_ME_FULLCHAIN_PEM
  tls.key: CHANGE_ME_PRIVKEY_PEM

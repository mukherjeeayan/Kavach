# secrets.yml - Kubernetes secrets template
#
# SECURITY: Do NOT apply this file directly with `kubectl apply`.
# Secrets must be created individually using kubectl commands to prevent
# placeholder values from becoming live credentials.
#
# Create secrets using these commands:
#
# kubectl create namespace kavach 2>/dev/null || true
#
# kubectl create secret generic kavach-secrets \
#   --namespace=kavach \
#   --from-literal=db-user=YOUR_DB_USER \
#   --from-literal=db-password=$(openssl rand -base64 32) \
#   --from-literal=redis-password=$(openssl rand -base64 32) \
#   --from-literal=jwt-secret=$(openssl rand -base64 48) \
#   --from-literal=jwt-refresh-secret=$(openssl rand -base64 48) \
#   --from-literal=admin-access-key=$(openssl rand -base64 32) \
#   --from-literal=data-encryption-key=$(openssl rand -base64 32)
#
# For TLS (if not using cert-manager):
# kubectl create secret tls kavach-tls \
#   --namespace=kavach \
#   --cert=./fullchain.pem \
#   --key=./privkey.pem

apiVersion: v1
kind: Secret
metadata:
  name: kavach-secrets
  namespace: kavach
  labels:
    app.kubernetes.io/name: kavach
    app.kubernetes.io/component: secrets
  annotations:
    # Prevent accidental application of template with placeholder values
    kubernetes.io/description: >
      Created via kubectl create secret commands. Do not apply this template directly.
type: Opaque
data: {}  # All values must be provided via kubectl create secret --from-literal
---
# TLS secret referenced by ingress.yml (kavach-tls).
# This is normally auto-managed by cert-manager with the letsencrypt-prod
# ClusterIssuer. The template below shows the expected shape if you need
# to bootstrap it manually (e.g. for staging or a private CA).
apiVersion: v1
kind: Secret
metadata:
  name: kavach-tls
  namespace: kavach
  labels:
    app.kubernetes.io/name: kavach
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
data: {}  # Create via: kubectl create secret tls kavach-tls --cert=./fullchain.pem --key=./privkey.pem

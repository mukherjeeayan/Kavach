<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'nonce-%NONCE%' https://api.mapbox.com; style-src 'self' 'nonce-%NONCE%' https://api.mapbox.com; img-src 'self' https://*..mapbox.com data: blob:; connect-src 'self' https://api.mapbox.com wss:; font-src 'self' data:">
    <meta name="description" content="SafeGuard Parent Portal - parental control and child safety monitoring">
    <meta name="author" content="SafeGuard Parent Control">
    <meta name="keywords" content="parental control, child safety, monitoring, geofence, screen time, web filtering">
    <title>SafeGuard Parent Portal</title>
    <script>
      // Apply dark mode class before paint to prevent flash
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
